[workspace]
members = ["nodedb-lite", "nodedb-lite-ffi", "nodedb-lite-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/NodeDB-Lab/nodedb-lite"
homepage = "https://nodedb.dev"

[workspace.dependencies]
# Internal
nodedb-lite = { path = "nodedb-lite", version = "0.1.0", default-features = false }
nodedb-types = { version = "0.5" }
nodedb-client = { version = "0.5" }
nodedb-codec = { version = "0.5" }
nodedb-crdt = { version = "0.5" }
nodedb-query = { version = "0.5" }
nodedb-spatial = { version = "0.5" }
nodedb-graph = { version = "0.5" }
nodedb-vector = { version = "0.5" }
nodedb-fts = { version = "0.5" }
nodedb-strict = { version = "0.5" }
nodedb-columnar = { version = "0.5" }
nodedb-sql = { version = "0.5" }
nodedb-array = { version = "0.5" }
nodedb-physical = { version = "0.5" }

# Async
tokio = { version = "1" }
tokio-tungstenite = "0.30"
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "2.0"
tracing = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
# Fork pending upstream nuskey8/zerompk#61: the derived codecs are
# `inline(always)`, which folds whole codec trees into one function and makes
# large plan enums cost minutes to compile. Drop the git source once released.
zerompk = { version = "0.7", git = "https://github.com/farhan-syah/zerompk", rev = "bb3156cf17b399b0dc2dd90895133a169a29cac0", features = [
  "std",
  "derive",
] }

# Storage
# A caret requirement never matches a prerelease, so `version = "0"` could not
# resolve against a registry that only publishes `0.1.0-beta.*`. Name the
# prerelease explicitly.
pagedb = { version = "0.1.0-beta.6", default-features = false }
# Matches the `Bytes` type pagedb's txn API returns; must track pagedb's own
# `bytes` major so the two resolve to one version and stay assignable.
bytes = "1"
roaring = "0.11"
lru = "0.18"
arrow = { version = "59", default-features = false, features = ["ipc"] }
crc32c = "0.6"

# CRDTs
loro = "1"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.4", features = ["std"] }

# Testing
tempfile = "3"
rust_decimal = { version = "1", features = ["serde-with-str"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.dev]
debug = "line-tables-only"
# Strip symbol tables from dev/test binaries to keep target/ small. This
# unsymbolises ordinary dev builds; use `--profile debugging` for full symbols.
strip = true

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
strip = false

[profile.ci]
inherits = "dev"
debug = false
incremental = false
