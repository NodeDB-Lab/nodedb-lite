# Resolve the shared `nodedb-*` and `pagedb` dependencies for a CI build.
#
# Lite is a separate workspace that consumes those crates from crates.io. It
# also tracks their UNRELEASED APIs: Lite commits routinely adapt to upstream
# changes that land in the Origin workspace weeks before the next publish. Two
# consequences follow, and both are why this action exists:
#
#   - `nodedb-* = "0.5"` does not resolve — 0.5.0 exists only in the Origin
#     working tree; crates.io's newest is 0.4.0.
#   - `pagedb = "0"` does not resolve — crates.io has only `0.1.0-beta.*`, and
#     a caret requirement never matches a prerelease.
#
# Local development papers over both with a `[patch.crates-io]` block in
# `.cargo/config.toml`, which is gitignored and therefore absent on a runner.
# So CI resolved against the registry and failed before compiling a single
# line. This action reproduces the local patch on the runner: it checks the
# sibling sources out outside the workspace, the layout local development uses
# (`../nodedb`), and writes the same patch table.
#
# `sources: registry` turns the whole thing into a no-op, for the release path
# — a publish gate must validate against what crates.io actually serves, not
# against unreleased sibling checkouts.

name: Set up Lite workspace
description: Check out the sibling nodedb/pagedb sources and patch cargo to resolve against them.

inputs:
  sources:
    description: "`sibling` to patch against checked-out sources, `registry` to resolve from crates.io."
    required: false
    default: sibling
  nodedb-ref:
    description: Git ref of the Origin (NodeDB-Lab/nodedb) workspace to build against.
    required: false
    default: main
  pagedb-ref:
    description: Git ref of the pagedb repository to build against.
    required: false
    default: main

runs:
  using: composite
  steps:
    # The siblings must live OUTSIDE $GITHUB_WORKSPACE.
    #
    # Cargo resolves a path dependency's `workspace = true` inheritance against
    # the root manifest of the workspace it considers that dependency to be in.
    # Nested inside the consumer's directory, that is the CONSUMER's root:
    # `.ci-sources/nodedb/nodedb-array` inherited `nodedb-wal` from Lite's root
    # manifest, which defines no such dependency, and the build died parsing
    # the sibling. Outside the tree, cargo walks up to the sibling's own root —
    # the layout local development uses (`../nodedb`).
    #
    # They stay path dependencies, not workspace members, so `--workspace`
    # lint/test still covers Lite only.
    #
    # `actions/checkout` rejects a `path:` outside the workspace, so fetch with
    # git. Fetching a ref covers branches, tags and SHAs alike.
    - name: Check out the sibling sources
      if: inputs.sources == 'sibling'
      shell: bash
      env:
        NODEDB_REF: ${{ inputs.nodedb-ref }}
        PAGEDB_REF: ${{ inputs.pagedb-ref }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/ci-sources"
        mkdir -p "$dest"
        fetch() {
          local repo="$1" ref="$2" dir="$dest/$3"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init --quiet
          git -C "$dir" remote add origin "https://github.com/NodeDB-Lab/$repo"
          git -C "$dir" fetch --quiet --depth 1 origin "$ref"
          git -C "$dir" checkout --quiet FETCH_HEAD
        }
        fetch nodedb "$NODEDB_REF" nodedb
        fetch pagedb "$PAGEDB_REF" pagedb

    # Mirrors the `[patch.crates-io]` block in the gitignored local
    # `.cargo/config.toml`. Every shared crate is patched together, including
    # ones Lite pulls in only transitively: patching a subset would leave two
    # copies of a shared type in the graph and fail to compile with mismatched
    # types that name the same path.
    - name: Write cargo patch table
      if: inputs.sources == 'sibling'
      shell: bash
      run: |
        set -euo pipefail
        origin="$RUNNER_TEMP/ci-sources/nodedb"
        mkdir -p .cargo
        {
          echo "# Generated by .github/actions/setup-workspace — do not commit."
          echo "[patch.crates-io]"
          for crate in types client codec crdt query spatial graph vector fts \
                       strict columnar sql array mem wal physical; do
            echo "nodedb-$crate = { path = \"$origin/nodedb-$crate\" }"
          done
          echo "pagedb = { path = \"$RUNNER_TEMP/ci-sources/pagedb\" }"
        } > .cargo/config.toml
        cat .cargo/config.toml

    # A patch entry pointing at a directory that does not exist fails with a
    # manifest error hundreds of lines into a cargo invocation. Assert the
    # layout here instead, where the message names the missing crate.
    - name: Verify patched sources exist
      if: inputs.sources == 'sibling'
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        while read -r path; do
          if [ ! -f "$path/Cargo.toml" ]; then
            echo "::error::patched source missing: $path/Cargo.toml"
            missing=1
          fi
        done < <(grep -o 'path = "[^"]*"' .cargo/config.toml | sed 's/path = "//; s/"$//')
        exit "$missing"

    # A workspace-level inconsistency in the sibling sources — a member
    # inheriting a dependency the root manifest does not define — surfaces as a
    # cargo error hundreds of lines into the first real command, where it reads
    # as the pull request's own breakage. Parse the sibling workspaces here
    # instead, so the failure names the upstream ref. `--no-deps` keeps this a
    # manifest parse: no dependency resolution, no registry index.
    - name: Preflight the sibling workspaces
      if: inputs.sources == 'sibling'
      shell: bash
      run: |
        set -euo pipefail
        for manifest in "$RUNNER_TEMP/ci-sources/nodedb/Cargo.toml" "$RUNNER_TEMP/ci-sources/pagedb/Cargo.toml"; do
          if ! cargo metadata --format-version=1 --no-deps --manifest-path "$manifest" > /dev/null; then
            echo "::error::$manifest does not parse — the sibling sources at nodedb-ref=${{ inputs.nodedb-ref }} / pagedb-ref=${{ inputs.pagedb-ref }} are internally inconsistent. This is upstream state, not this pull request. Re-run once upstream settles."
            exit 1
          fi
        done

    - name: Report registry mode
      if: inputs.sources != 'sibling'
      shell: bash
      run: echo "sources=${{ inputs.sources }} — resolving from crates.io, no patch table written."
