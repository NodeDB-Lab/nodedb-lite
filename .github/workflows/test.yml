# Reusable test workflow: fmt, clippy, dependency audit, native test suite,
# and a wasm32 build check.
#
# Called by:
#   - ci.yml              (PR checks — opt-in via the `run-ci` label)
#   - release-prepare.yml (tag gate)
#
# Lite is a separate workspace from Origin and consumes the shared `nodedb-*`
# crates (and `pagedb`) as registry dependencies. Because Lite tracks their
# unreleased APIs, those requirements do not resolve against crates.io between
# publishes; `.github/actions/setup-workspace` checks the sibling sources out
# and patches cargo at them. Pass `sources: registry` to validate against what
# crates.io actually serves instead — the correct mode for a publish gate, and
# the wrong one for a PR.
#
# Cache strategy: both jobs share one `target/` cache via
# `shared-key: lite-workspace`; the `lint` job seeds it on cold runs.

name: Test

on:
  workflow_call:
    inputs:
      sources:
        description: "`sibling` to build against checked-out nodedb/pagedb sources, `registry` for crates.io."
        required: false
        type: string
        default: sibling
      nodedb-ref:
        description: Git ref of the Origin workspace to build against.
        required: false
        type: string
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Check
    # Free ARM64 runner for public repos — same rationale as the Origin
    # workspace: ~40% faster per core at the same (zero) cost.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: lite-workspace
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config protobuf-compiler perl \
            libcurl4-openssl-dev libsasl2-dev
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          sources: ${{ inputs.sources }}
          nodedb-ref: ${{ inputs.nodedb-ref }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - name: Check wasm32 target
        run: cargo check -p nodedb-lite-wasm --target wasm32-unknown-unknown
      # build.rs regenerates the C header on every build. Nothing else notices
      # when the committed copy no longer matches what cbindgen produces, so
      # the repo can ship a header that declares a surface the library does
      # not have.
      - name: Check the committed C header is current
        run: |
          cargo build -p nodedb-lite-ffi --profile ci
          git diff --exit-code -- nodedb-lite-ffi/include/nodedb_lite.h
      # abi/surface.txt is read from the header and from source. This proves
      # those declarations correspond to symbols the built library actually
      # exports — a source-only check is blind wherever the two disagree.
      - name: Check exported symbols match the recorded surface
        run: |
          set -euo pipefail
          SO=$(find target -name 'libnodedb_lite_ffi.so' -print -quit)
          test -n "$SO" || { echo "::error::cdylib not found"; exit 1; }
          nm -D --defined-only "$SO" \
            | awk '$2 == "T" { print $3 }' | sort -u > /tmp/exported.txt
          grep -oE '\b(nodedb_[a-z0-9_]+|Java_[A-Za-z0-9_]+)\(' \
            nodedb-lite-ffi/abi/surface.txt \
            | tr -d '(' | sort -u > /tmp/recorded.txt
          if ! diff -u /tmp/recorded.txt /tmp/exported.txt; then
            echo "::error::Exported symbols differ from abi/surface.txt."
            echo "Re-record with: UPDATE_ABI_SNAPSHOT=1 cargo nextest run \
              -p nodedb-lite-ffi -E 'binary(abi_surface)'"
            exit 1
          fi
      - name: Advisory-ignore policy gate
        run: python3 scripts/ci/check_advisory_ignores.py
      - name: Install cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency audit
        run: cargo deny check

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: lite-workspace
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config protobuf-compiler perl \
            libcurl4-openssl-dev libsasl2-dev
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          sources: ${{ inputs.sources }}
          nodedb-ref: ${{ inputs.nodedb-ref }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: nextest@0.9.140
      - name: Run tests
        run: |
          cargo nextest run \
            --workspace \
            --cargo-profile ci --profile ci \
            --no-fail-fast
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-report
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
