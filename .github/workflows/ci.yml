# CI — the pull-request entry point. Calls the reusable native and wasm suites
# so a PR produces one stable set of check names.
#
# Opt-in, matching the Origin workspace: a pull request runs the suites only
# while it carries the `run-ci` label. Lite builds against the sibling
# nodedb/pagedb sources at a moving ref, so an unrelated commit landing in the
# Origin workspace mid-refactor fails `setup-workspace` before a line of Lite
# compiles. Running that on every push reports upstream breakage as if it were
# the PR's, and the contributor cannot fix it. Nothing in the `main` ruleset
# requires these checks, so an unlabelled PR stays mergeable.
#
# To run it:
#   - add the `run-ci` label to the PR (remove + re-add to force a re-run), or
#   - Actions → CI → Run workflow, against any branch.
#
# While the label is on, every subsequent push to the PR re-runs the suites.
#
# A nightly `schedule` run probes the same suites against whatever the sibling
# refs currently point at, so upstream breakage surfaces on a quiet run of
# `main` instead of on the next PR a maintainer labels. GitHub sends failure
# notifications for a scheduled run to whoever last edited the cron line.
#
# PRs build against the sibling nodedb/pagedb sources (the `sources` default);
# the release path passes `registry` instead. See test.yml's header.

name: CI

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A manual dispatch always runs. A pull request runs only when opted in via
  # the label, and never while it is a draft. `github.event.pull_request` is
  # null on a dispatch, so the event check has to come first.
  test:
    name: Test Suite
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-ci') &&
       github.event.pull_request.draft != true)
    uses: ./.github/workflows/test.yml

  wasm:
    name: WASM
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-ci') &&
       github.event.pull_request.draft != true)
    uses: ./.github/workflows/wasm.yml
