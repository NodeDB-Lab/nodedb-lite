# CI — the single pull-request entry point. Calls the reusable native and wasm
# suites so a PR produces one stable set of check names to require in the
# branch ruleset.
#
# Unlike the Origin workspace, whose suite is a ~10-minute cold compile behind
# a `run-ci` label, Lite's runs unconditionally on every pull request. Lite is
# small enough that opting in would only ever be forgotten.
#
# PRs build against the sibling nodedb/pagedb sources (the `sources` default);
# the release path passes `registry` instead. See test.yml's header.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A manual dispatch always runs; a pull request runs unless it is a draft.
  # The previous `github.event.pull_request.draft == false` also skipped every
  # workflow_dispatch run, where `github.event.pull_request` is null.
  test:
    name: Test Suite
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true
    uses: ./.github/workflows/test.yml

  wasm:
    name: WASM
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true
    uses: ./.github/workflows/wasm.yml
