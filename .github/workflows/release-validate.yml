# Reusable tag/version validation. Called by release-prepare.yml (from the
# pushed tag) and release.yml (from the dispatched tag), so the two entry
# points can never disagree about what a tag means.

name: Release Validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate (a v* tag)"
        required: true
        type: string
    outputs:
      version:
        description: "Tag version without the leading v"
        value: ${{ jobs.validate.outputs.version }}
      is_full_release:
        description: "true when the version carries no prerelease suffix"
        value: ${{ jobs.validate.outputs.is_full_release }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_full_release: ${{ steps.version.outputs.is_full_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag against Cargo.toml
        id: version
        env:
          TAG: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"

          META=$(cargo metadata --no-deps --format-version=1)
          CARGO_VERSION=$(jq -r '.packages[] | select(.name == "nodedb-lite") | .version' <<<"$META")

          echo "Tag version:        $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z]+\.[0-9]+)?$ ]]; then
            echo "::error::Invalid tag format '$TAG'. Expected: vX.Y.Z or vX.Y.Z-label.N"
            exit 1
          fi

          # The tagged commit carries the release version itself. A tag on a
          # commit without the version bump is refused.
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match the workspace version '$CARGO_VERSION'. Commit the version bump to $TAG_VERSION, then move the tag to that commit."
            exit 1
          fi

          # Every publishable crate publishes at the tag version. Crates with
          # `publish = false` keep their own version.
          STRAY=$(jq -r --arg v "$TAG_VERSION" \
            '.packages[] | select(.publish != [] and .version != $v) | "\(.name) \(.version)"' <<<"$META" | paste -sd, -)
          if [[ -n "$STRAY" ]]; then
            echo "::error::These crates are not at version $TAG_VERSION: $STRAY. Set them to version.workspace = true."
            exit 1
          fi

          # Full release = no hyphen suffix (v0.1.0, not v0.1.0-beta.1)
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "is_full_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_full_release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
